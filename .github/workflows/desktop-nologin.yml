name: Desktop apps (no login)

# Builds "Observer Local" for macOS, Windows and Linux: no Auth0 login,
# on-device models or your own server. Installers are attached to the run as artifacts.
# Not code-signed: macOS needs right-click > Open (or xattr), Windows shows a SmartScreen prompt.

on:
  workflow_dispatch:
  push:
    branches: [no-login]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/desktop
            cli
          key: ${{ matrix.target }}

      # Same pinned webkit as upstream release.yml (avoids EGL_BAD_PARAMETER in the AppImage)
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
          sudo apt-get install -y --allow-downgrades \
            libwebkit2gtk-4.1-dev=2.44.* libwebkit2gtk-4.1-0=2.44.* gir1.2-webkit2-4.1=2.44.* \
            libjavascriptcoregtk-4.1-dev=2.44.* libjavascriptcoregtk-4.1-0=2.44.* gir1.2-javascriptcoregtk-4.1=2.44.*

      - name: Install JS dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend (login disabled)
        working-directory: app
        shell: bash
        env:
          VITE_DISABLE_AUTH: 'true'
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec vite build --sourcemap false

      - name: Build observe CLI sidecar
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
          mkdir -p app/desktop/binaries
          EXT=""; [[ "${{ runner.os }}" == "Windows" ]] && EXT=".exe"
          cp "cli/target/${{ matrix.target }}/release/observe$EXT" "app/desktop/binaries/observe-${{ matrix.target }}$EXT"

      - name: Build desktop app
        working-directory: app/desktop
        shell: bash
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '10.15' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '10.15' || '' }}
          # llama.cpp's vendored cpp-httplib breaks against newer OpenSSL headers (see upstream release.yml)
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: 'TRUE'
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: observer-local-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/desktop/target/${{ matrix.target }}/release/bundle/msi/*.msi
            app/desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            app/desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
